<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1418"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>鋼鉄の大陸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#0f1418;--bg2:#161d23;--bg3:#1f2830;--line:#2c3842;--fg:#e6e9ea;--fg2:#9aa8b2;--amber:#f2b134;--amber2:#c98a1a;--steel:#5d8bb3;--steel2:#3c5f7f;
  --ok:#6fcf79;--warn:#f2c94c;--bad:#e85d4a;--ink:#0b0f12;--gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  --font:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;--font-head:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=range]{width:100%;padding:0;accent-color:var(--amber)}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-weight:600;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--steel)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#f6c25a,#d9961e);color:#1e160a;border-color:#f8d58a}
.btn.danger{background:#7a2b22;border-color:#b94a3c;color:#ffe8e3}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.xs{min-height:28px;padding:2px 10px;font-size:12px;font-weight:500}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--fg2)}
.small{font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.amber{color:var(--amber)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px}
.card+.card{margin-top:10px}
.card h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--fg2);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv b{font-weight:500;color:var(--fg2)}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;background:var(--bg3);white-space:nowrap}
.pill.on{background:var(--amber);color:#1e160a;border-color:var(--amber);font-weight:600}
.pill.bad{border-color:var(--bad);color:#ffb3a8}
.pill.ok{border-color:var(--ok);color:#b7f0bd}
.flag{display:inline-block;vertical-align:middle;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.bar{height:8px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}.bar.steel i{background:var(--steel)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{color:var(--fg2);font-weight:500;font-size:11.5px}
table.tbl td.num,table.tbl th.num{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);text-align:left;width:100%}
.item.on{border-color:var(--amber)}
.item b{display:block;font-size:13.5px;font-weight:600}
.item small{display:block;color:var(--fg2);font-size:11.5px;line-height:1.35}
.item .r{margin-left:auto;text-align:right;white-space:nowrap}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.sl b{font-weight:500;min-width:86px;color:var(--fg2)}
.sl em{font-style:normal;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 10px;font-size:12.5px;background:var(--bg3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amber);color:#1e160a;font-weight:600}
.seg button:disabled{opacity:.4}
/* ---------- toast & modal ---------- */
#toast-root{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:92vw}
.toast{background:rgba(20,28,34,.96);border:1px solid var(--amber2);color:var(--fg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#modal-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.mwrap{position:absolute;inset:0;background:rgba(4,8,10,.72);display:flex;align-items:center;justify-content:center;padding:14px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut-l);pointer-events:auto;animation:fin .15s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:12px;width:100%;max-width:560px;max-height:min(88vh,860px);overflow-y:auto;padding:16px 16px 14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal h3{font-size:17px;margin-bottom:8px;letter-spacing:.02em}
.modal .body{white-space:pre-line;font-size:13.5px;color:#d6dadb;margin-bottom:10px}
.modal .choices{display:flex;flex-direction:column;gap:6px}
.modal .ch{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);text-align:left}
.modal .ch:hover{border-color:var(--amber)}
.modal .ch b{font-size:14px}
.modal .ch small{color:var(--fg2);font-size:12px;line-height:1.35}
.modal .ch:disabled{opacity:.4}
.modal .seal{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--amber);border:1px solid var(--amber2);border-radius:4px;padding:1px 8px;margin-bottom:6px}
/* ---------- title ---------- */
#scr-title{background:radial-gradient(ellipse at 50% 30%,#1c2a36,#0b1014 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px var(--gut-r) 20px var(--gut-l);text-align:center}
#scr-title .logo{font-size:44px;letter-spacing:.18em;font-weight:700;color:#f0f3f5;text-shadow:0 2px 0 #2a3a48,0 10px 30px rgba(0,0,0,.6)}
#scr-title .logo small{display:block;font-size:13px;letter-spacing:.5em;color:var(--amber);font-weight:500;margin-top:6px}
#scr-title .sub{color:var(--fg2);font-size:13px;max-width:420px}
#scr-title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,92vw)}
#scr-title canvas.bgcv{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55}
#scr-title>*{position:relative}
/* ---------- setup ---------- */
#scr-setup{display:flex;flex-direction:column}
#scr-setup .top{padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut-r) 8px var(--gut-l);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg2)}
#scr-setup .body{flex:1;overflow-y:auto;padding:12px var(--gut-r) 12px var(--gut-l)}
.natgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.natcard{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg3);text-align:left}
.natcard.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.natcard .h{display:flex;align-items:center;gap:8px}
.natcard b{font-size:13.5px}
.natcard small{color:var(--fg2);font-size:11.5px;line-height:1.35}
.natcard .st{display:flex;gap:6px;font-size:11px;color:var(--fg2)}
#scr-setup .foot{padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);border-top:1px solid var(--line);background:var(--bg2);display:flex;gap:8px;align-items:center}
/* ---------- main (strategic) ---------- */
#scr-main{background:#0d1518}
#map-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) var(--gut-r) 6px var(--gut-l);display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(8,12,15,.95),rgba(8,12,15,.6) 80%,rgba(8,12,15,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar .nat{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .nat b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .nat small{display:block;color:var(--fg2);font-size:11px}
.topbar .stats{display:flex;gap:10px;margin-left:auto;font-size:12px;white-space:nowrap}
.topbar .stats span{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.topbar .stats small{color:var(--fg2);font-size:10px}
.topbar .stats b{font-variant-numeric:tabular-nums;font-size:13px}
.icbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(22,29,35,.92);font-size:17px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icbtn.on{background:var(--amber);color:#1e160a}
.maptools{position:absolute;right:var(--gut-r);top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.icbtn.mode{font-size:11px;font-weight:600;letter-spacing:.04em}
.tabbar button.endturn{flex:1.3;background:linear-gradient(180deg,#f6c25a,#d9961e);color:#1e160a!important;font-weight:700;border-radius:10px;margin-left:4px}
.tabbar button.endturn i{color:#1e160a}
.tabbar button.endturn:disabled{opacity:.5}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(14,20,24,.97);border-top:1px solid var(--line);padding:4px var(--gut-r) calc(4px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11px;color:var(--fg2);border-radius:8px}
.tabbar button i{font-style:normal;font-size:17px;line-height:1}
.tabbar button.on{color:var(--amber);background:rgba(242,177,52,.1)}
.sheet{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));max-height:min(62%,560px);background:rgba(16,22,27,.97);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.5);transform:translateY(0);transition:transform .2s}
.sheet[hidden]{display:none}
.sheet .sh-h{display:flex;align-items:center;gap:8px;padding:8px var(--gut-r) 6px var(--gut-l);border-bottom:1px solid var(--line)}
.sheet .sh-h h2{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh-b{overflow-y:auto;padding:10px var(--gut-r) 12px var(--gut-l);-webkit-overflow-scrolling:touch}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 6px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg3);font-size:12.5px;white-space:nowrap;flex:none}
.subtabs button.on{background:var(--amber);color:#1e160a;border-color:var(--amber);font-weight:600}
.news{position:absolute;left:var(--gut-l);top:calc(70px + env(safe-area-inset-top,0px));max-width:min(70vw,360px);display:flex;flex-direction:column;gap:3px;pointer-events:none}
.news div{background:rgba(8,12,15,.7);padding:3px 8px;border-radius:6px;font-size:12px;color:#dfe5e8;border-left:3px solid var(--steel)}
.news div.good{border-left-color:var(--ok)}.news div.bad{border-left-color:var(--bad)}.news div.war{border-left-color:var(--amber)}.news div.peace{border-left-color:#9ad}
@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;width:460px;max-height:78%;border-radius:14px;border:1px solid var(--line)}
  .tabbar{left:16px;right:auto;bottom:16px;border-radius:12px;border:1px solid var(--line);padding:4px 6px}
  .tabbar button{padding:6px 12px}
}
/* ---------- battle ---------- */
#scr-battle{background:#0b1114;touch-action:none;user-select:none;-webkit-user-select:none}
#bt-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bt-top{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) var(--gut-r) 6px var(--gut-l);display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,rgba(8,12,15,.95),rgba(8,12,15,.55) 75%,rgba(8,12,15,0));pointer-events:none}
.bt-top>*{pointer-events:auto}
.bt-row{display:flex;align-items:center;gap:8px}
.bt-title{flex:1;min-width:0;line-height:1.2}
.bt-title b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-title span{font-size:11.5px;color:var(--fg2)}
.bt-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12px}
.bt-side{display:flex;align-items:center;gap:6px;min-width:0}
.bt-side.r{justify-content:flex-end}
.bt-side b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-side span{color:var(--fg2);white-space:nowrap}
.bt-log{align-self:flex-start;max-width:min(64vw,380px);font-size:12px;display:flex;flex-direction:column;gap:2px;pointer-events:none!important}
.bt-log div{background:rgba(8,12,15,.7);padding:2px 8px;border-radius:6px;color:#dfe5e8}
.bt-log .s0{color:#cfe8dc}.bt-log .s1{color:#f0b3a5}
.bt-tools{position:absolute;right:var(--gut-r);top:calc(88px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.bt-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--panel-h,150px) + 12px);background:rgba(242,177,52,.96);color:#1e160a;padding:6px 14px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bt-panel{position:absolute;left:0;right:0;bottom:0;padding:8px var(--gut-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:linear-gradient(0deg,rgba(10,15,18,.97) 70%,rgba(10,15,18,.8));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-height:44%}
.bt-sel{font-size:12.5px;min-height:36px}
.sel-h{display:flex;gap:8px;align-items:center}
.sel-h b{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-h .st{color:var(--amber);font-size:12px;white-space:nowrap}
.sel-stats{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--fg2)}
.sel-stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.sel-empty{color:var(--fg2);font-size:12.5px}
.bt-cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.cmd{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);font-size:12.5px;padding:3px 2px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cmd small{font-size:10px;color:var(--fg2)}
.cmd.em{border-color:var(--amber2);color:var(--amber)}
.cmd.pri{background:linear-gradient(180deg,#f6c25a,#d9961e);color:#1e160a;border-color:#f8d58a;font-weight:700}
.cmd:disabled{opacity:.35}
.bt-end{position:absolute;right:var(--gut-r);bottom:calc(var(--panel-h,150px) + 12px);min-height:44px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#f6c25a,#d9961e);color:#1e160a;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.bt-end:disabled{opacity:.5}
.bt-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,10,.5);pointer-events:none}
.bt-over .big{font-size:40px;font-weight:700;letter-spacing:.2em;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.8);animation:bigin .6s ease-out}
@keyframes bigin{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .bt-panel{left:auto;right:12px;bottom:12px;width:420px;border:1px solid var(--line);border-radius:12px;max-height:60%}
  .bt-hint{bottom:24px}
  .bt-end{right:452px;bottom:24px}
}
/* ---------- misc ---------- */
.eqrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg3)}
.eqrow b{font-size:13px}
.eqrow small{display:block;color:var(--fg2);font-size:11px}
.eqrow .stats{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--fg2);margin-top:2px}
.eqrow .stats i{font-style:normal;background:rgba(255,255,255,.06);border-radius:4px;padding:0 4px}
.statline{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg2)}
.statline b{color:var(--fg);font-weight:500}
.lawopt{display:flex;flex-direction:column;gap:4px}
.lawopt button{display:flex;flex-direction:column;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);text-align:left}
.lawopt button.on{border-color:var(--amber);background:rgba(242,177,52,.12)}
.lawopt button b{font-size:13px}
.lawopt button small{color:var(--fg2);font-size:11.5px}
.lawopt button:disabled{opacity:.45}
.tslot{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tslot .grow{flex:1;min-width:0}
.tslot .bar{margin-top:4px}
.tslot-n{width:20px;height:20px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.tog{display:flex;gap:8px;align-items:center;padding:8px 0 2px;font-size:13px}
.tog input{width:18px;height:18px;accent-color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.chip{padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg3);font-size:12px;white-space:nowrap}
.chip small{color:var(--fg2);font-size:10px;margin-left:2px}
.chip.on{background:var(--amber);color:#1e160a;border-color:var(--amber);font-weight:600}
.chip.on small{color:#4a3a14}
.chip.act{border-color:var(--steel)}
.tconcept{padding:6px 0;border-bottom:1px solid var(--line)}
.tconcept:last-child{border-bottom:0}
.tc-h{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.tc-h b{font-weight:600}
.tc-h small{font-size:11px}
.tiers{display:flex;flex-wrap:wrap;gap:4px}
.tier{position:relative;min-width:40px;height:32px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);font-size:12px;font-weight:600;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.tier small{font-size:9px;font-weight:400;color:var(--fg2)}
.tier.done{background:var(--amber);color:#1e160a;border-color:var(--amber)}
.tier.act{border-color:var(--steel);background:linear-gradient(90deg,var(--steel2) var(--p,0%),var(--bg3) var(--p,0%))}
.tier.q{border-color:var(--steel);border-style:dashed}
.tier.can{border-color:var(--fg2)}
.tier.lock{opacity:.4}
.tap{cursor:pointer}
.modal h4{margin:10px 0 4px;font-size:12px;color:var(--fg2);letter-spacing:.06em}
.techrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.techrow b{font-weight:600;min-width:90px}
.techrow .lv{display:flex;gap:3px}
.techrow .lv i{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.08);display:inline-block}
.techrow .lv i.on{background:var(--amber)}
.rel{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg3)}
.rel b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .v{font-variant-numeric:tabular-nums;font-size:12px;min-width:60px;text-align:right}
.prov-h{display:flex;align-items:center;gap:8px}
.prov-h b{font-size:15px}
.intro-pages{display:flex;flex-direction:column;gap:10px}
.help{white-space:pre-line;font-size:13px;line-height:1.6}
.help b{color:var(--amber)}

.su-tabs{padding:8px var(--gut-r) 6px var(--gut-l);background:var(--bg2);border-bottom:1px solid var(--line);margin:0}
.su-top{display:block}

.su-rg{margin:14px 0 6px;font-size:12px;color:var(--amber);letter-spacing:.08em;font-weight:600}

.traits{display:flex;flex-direction:column;gap:4px;margin-top:8px}

const EQ = {};

  const tags = new Set(String(r.tag || '').split(/\s+/).filter(Boolean));
  const o = { id: r.id, n: r.n, cls: r.cls, lin: r.lin, y: r.y, t: r.t, c: r.c, l: r.l, a: r.a, s: r.s, def: r.def, mv: r.mv, rng: r.rng, fuel: r.fuel, ammo: r.ammo, tags };
  o.hp = 10; o.cap = 0;
  o.lift = 0;
  for (const t of tags) { if (t.startsWith('hp:')) o.hp = +t.slice(3); if (t.startsWith('cap:')) o.cap = +t.slice(4); if (t.startsWith('lift:')) o.lift = +t.slice(5); }
  if (o.cls === 'lha' && !o.lift) o.lift = o.c >= 40 ? 4 : o.c >= 25 ? 3 : 2;

  o.vis = uc.vis + (tags.has('vis') ? 1 : 0);

  o.asw = tags.has('asw');
  o.amph = tags.has('amph');
  o.carrierOK = tags.has('cv');
  o.aw = tags.has('aw');
  o.lr = tags.has('lr');
  o.canCap = !!uc.cap && (tags.has('cap') || uc.cap);
  o.upkeep = Math.round(o.c * 5) / 100;   // 月の維持費（億）：価格の 5%
  o.months = o.dom === 'sea' ? (o.c >= 60 ? 10 : o.c >= 25 ? 6 : 4) : o.dom === 'air' ? 3 : 2;

});

// 系譜の名前

/* =========================================================
   鋼鉄の大陸 — 技術ツリー（分野→系統→段階）・研究枠・効果
   ========================================================= */
const TECHS = {};
TECHS.ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
TECHS.BASE_SLOTS = 3; TECHS.MAX_SLOTS = 6;
TECHS.init = () => {
  const T = DATA_JSON.tech;
  TECHS.fields = T.fields; TECHS.cats = T.cats; TECHS.fieldById = {}; TECHS.nodes = {}; TECHS.list = [];
  for (const f of T.fields) {
    TECHS.fieldById[f.id] = f;
    f.concepts.forEach((c, ci) => {
      c.nodes = [];
      for (let t = 1; t <= c.tiers; t++) {
        const id = `${f.id}.${ci}.${t}`;
        const name = c.names && c.names[t - 1] ? c.names[t - 1] : `${c.n} ${TECHS.ROMAN[t - 1]}`;
        const req = [];
        if (t > 1) req.push(`${f.id}.${ci}.${t - 1}`);
        if (t === 1) for (const [fid, cj, tt] of c.req) req.push(`${fid}.${cj}.${tt}`);
        const node = { id, fid: f.id, ci, t, n: name, cost: Math.round(6 * Math.pow(t, 1.55) * (f.mul || 1) * (c.mul || 1)), year: c.y0 + (t - 1) * c.step, fx: c.fx, req, cat: f.cat, field: f, concept: c };
        TECHS.nodes[id] = node; TECHS.list.push(node); c.nodes.push(node);
      }
    });
  }
};
TECHS.node = (id) => TECHS.nodes[id];
// 装備の世代を解禁する設計ノード
TECHS.designNode = (cls, t) => { for (const f of TECHS.fields) { if (f.cat !== 'design') continue; const c = f.concepts[0]; if (c.fx && c.fx['tier:' + cls] != null) return c.nodes[Math.min(c.tiers, t) - 1] || null; } return null; };
TECHS.isDone = (nat, id) => !!(nat.res && nat.res.done[id]);
TECHS.canStart = (nat, id) => { const n = TECHS.nodes[id]; if (!n || TECHS.isDone(nat, id)) return false; if (nat.res.active.includes(id)) return false; if (n.fid === 'b_nuke' && G && G.cfg && G.cfg.nukes === 'none') return false; return n.req.every(r => TECHS.isDone(nat, r)); };
TECHS.available = (nat) => TECHS.list.filter(n => TECHS.canStart(nat, n.id));
TECHS.cost = (nat, node) => { const y = S.year(); const ahead = Math.max(0, node.year - y); return Math.round(node.cost * (1 + ahead * 0.2)); };
TECHS.slots = (nat) => Math.min(TECHS.MAX_SLOTS, TECHS.BASE_SLOTS + Math.floor(TECHS.mods(nat).slots || 0));
// 効果の合計（完了ノードの fx ＋ 国家特性 ＋ 政体）
TECHS.mods = (nat) => {
  if (!nat.res) return {};
  if (nat._mods && nat._modsN === nat.res.n && nat._modsTr === nat.traits && nat._modsG === nat.gov) return nat._mods;
  const m = {};
  for (const id in nat.res.done) { const node = TECHS.nodes[id]; if (!node) continue; for (const k in node.fx) { if (k.startsWith('tier:')) m[k] = Math.max(m[k] || 0, node.t); else m[k] = (m[k] || 0) + node.fx[k]; } }
  for (const t of nat.traits || []) { const T = D.TRAITS[t]; if (!T) continue; for (const k in T.fx) m[k] = (m[k] || 0) + T.fx[k]; }
  const g = D.GOV[nat.gov]; if (g) for (const k in g.fx) m[k] = (m[k] || 0) + g.fx[k];
  nat._mods = m; nat._modsN = nat.res.n; nat._modsTr = nat.traits; nat._modsG = nat.gov;
  return m;
};
TECHS.mod = (nat, k) => TECHS.mods(nat)[k] || 0;
TECHS.tier = (nat, cls) => Math.max(1, TECHS.mod(nat, 'tier:' + cls));
TECHS.has = (nat, k) => TECHS.mod(nat, k) > 0;
TECHS.markDone = (nat, id) => { if (!nat.res.done[id]) { nat.res.done[id] = 1; nat.res.n++; } };
TECHS.flag = (nat, k) => { for (const t of nat.traits || []) { const T = D.TRAITS[t]; if (T && T.flags && T.flags[k] != null) return T.flags[k]; } return null; };
TECHS.hashId = (s) => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h >>> 0; };
// 国の初期状態（2005 年の水準）。prof は国の技術の傾向
TECHS.startNation = (nat, prof) => {
  prof = prof || {};
  nat.res = { done: {}, n: 0, active: [], prog: {}, queue: [], auto: !nat.player };
  const major = nat.tier === 'super' || nat.tier === 'major';
  const rich = nat.wealth >= 1.1;
  const domLv = { land: prof.land || 1, air: prof.air || 1, sea: prof.sea || 1 };
  const rng = U.rng(WG.SEED0 + 101 + TECHS.hashId(nat.id));
  for (const f of TECHS.fields) {
    if (f.cat === 'design') {
      const lv = domLv[f.icon] || 1;
      f.concepts.forEach((c, ci) => {
        let upto = 0;

  for (const n of G.nations) { if (!n.res) TECHS.startNation(n, {}); n._mods = null; ST.init(n); if (!n.traits) n.traits = []; if (!n.lins) n.lins = [n.lin]; if (!n.econK) n.econK = S.econK(n.pop0 || 20, n.wealth, n.tier); }

};

// 勝敗・終了
S.checkEnd = () => {
  const me = S.me();

  const total = G.world.provs.length, mine = S.provsOf(G.player).length;
  const goal = G.cfg ? G.cfg.victory : 0.6;
  if (goal > 0 && mine >= total * goal) { G.over = { win: true, reason: `大陸の${Math.round(goal * 100)}%を手にし、覇権を確立した。` }; return; }

    const rank = G.nations.filter(n => n.alive).sort((a, b) => S.provsOf(b.idx).length - S.provsOf(a.idx).length).findIndex(n => n.idx === G.player) + 1;

/* =========================================================
   鋼鉄の大陸 — 経済・予算・税・法律・研究・開発・安定
   ========================================================= */
const EC = {};
EC.MUL_KEYS = ['revenue', 'upkeep', 'cost', 'research', 'prod', 'manpower', 'weariness'];
// 法律の効果をまとめる（加算のものは和、倍率のものは積）
EC.lawFx = (nat) => {
  const out = { stab: 0, growth: 0, industry: 0, rep: 0, exportIncome: 0, revenue: 1, upkeep: 1, cost: 1, research: 1, prod: 1, manpower: 1, weariness: 1, noWar: false };
  for (const k in D.LAWS) {
    const o = D.LAWS[k].opts[nat.laws[k]]; if (!o) continue;
    for (const f in o.fx) { if (EC.MUL_KEYS.includes(f)) out[f] *= o.fx[f]; else out[f] += o.fx[f]; }
    if (o.noWar) out.noWar = true;

};
EC.diffMul = (nat) => { const d = D.DIFF[G.diff] || D.DIFF[1]; return nat.player ? d.player : d.ai; };
EC.provGDP = (p, nat) => {
  const dmg = 1 - (p.dmg || 0) * 0.5;
  return p.pop * (0.3 + p.ind / 100) * (0.7 + 0.08 * (p.infra + EC.mod(nat, 'infraBonus'))) * nat.wealth * 1.8 * dmg * (nat.econK || 1);
};
EC.gdp = (nat) => U.sum(S.provsOf(nat.idx), p => EC.provGDP(p, nat)) * (1 + EC.mod(nat, 'gdp')) + EC.resourceIncome(nat);
EC.resourceIncome = (nat) => { const ps = S.provsOf(nat.idx); return U.sum(ps, p => (p.res.oil ? 3 * (1 + EC.mod(nat, 'res:oil') * 0.25) : 0) + (p.res.ore ? 2 * (1 + EC.mod(nat, 'res:ore') * 0.25) : 0)); };
EC.techMul = (nat, cat, per) => 1 + ((nat.tech && nat.tech[cat] || 1) - 1) * per;
EC.mod = (nat, k) => (typeof TECHS !== 'undefined' ? TECHS.mod(nat, k) : 0);
EC.revenue = (nat) => {
  const fx = EC.lawFx(nat);
  const stabMul = nat.stab < 30 ? 0.75 : nat.stab < 50 ? 0.9 : nat.stab > 80 ? 1.05 : 1;
  const tradeBonus = 1 + 0.3 * (1 - Math.exp(-DP.tradePartners(nat.idx).length / 7));   // 相手が増えるほど伸びは鈍る
  const rec = G.flags && G.flags.recession && G.flags.recession > G.turn ? 0.9 : 1;
  return EC.gdp(nat) * nat.tax * fx.revenue * stabMul * (tradeBonus + EC.mod(nat, 'trade')) * (1 + EC.mod(nat, 'revenue')) * EC.diffMul(nat) * rec;
};
EC.upkeep = (nat) => { const m = typeof TECHS !== 'undefined' ? TECHS.mods(nat) : {}; const ua = 1 + (m['upkeep:all'] || 0); return EC.lawFx(nat).upkeep * U.sum(nat.units, u => { const e = EQ.get(u.m); return e.upkeep * Math.max(0.3, ua + (m['upkeep:' + e.cls] || 0) + (m['upkeep:' + e.dom] || 0)); }) * (nat.stab < 25 ? 1.1 : 1); };
EC.recalc = (nat) => {
  const rev = EC.revenue(nat), up = EC.upkeep(nat);

  const st = nat.stat;
  st.gdp = EC.gdp(nat); st.rev = rev; st.upkeep = up;
  st.research = rev * b.research; st.dev = rev * b.dev; st.welfare = rev * b.welfare;
  st.interest = nat.debt * 0.012;

  return st;
};
EC.setTax = (nat, v) => { nat.tax = U.clamp(Math.round(v * 100) / 100, 0.05, 0.6); EC.recalc(nat); };
EC.setBudget = (nat, k, v) => { const b = nat.budget; b[k] = U.clamp(Math.round(v * 100) / 100, 0, 0.5); const tot = b.research + b.dev + b.welfare; if (tot > 0.8) { const over = tot - 0.8; b[k] = Math.max(0, b[k] - over); } EC.recalc(nat); };
EC.canSetLaw = (nat, key, opt) => {
  const o = D.LAWS[key] && D.LAWS[key].opts[opt]; if (!o) return '無い';
  if (nat.laws[key] === opt) return '今の法律';
  const t = nat.lawT[key]; if (t != null && G.turn - t < D.LAW_COOLDOWN) return `あと${D.LAW_COOLDOWN - (G.turn - t)}か月は変えられない`;
  if (o.war && !DP.atWar(nat.idx)) return '戦時にしか選べない';

};
EC.setLaw = (nat, key, opt) => { const why = EC.canSetLaw(nat, key, opt); if (why) return why; nat.laws[key] = opt; nat.lawT[key] = G.turn; EC.recalc(nat); return null; };

EC.researchPoints = (nat) => (2 + nat.stat.research) * EC.lawFx(nat).research * (1 + EC.mod(nat, 'research')) * (nat.stab > 60 ? 1 : 0.9);

// 開発（施設）
EC.buildCost = (nat, p, k) => Math.round(D.BUILD[k].cost((p.b[k] || 0) + 1) * EC.lawFx(nat).cost * Math.max(0.4, 1 + EC.mod(nat, 'buildCost')));
EC.canBuild = (nat, p, k) => {
  const B = D.BUILD[k]; if (!B) return '無い';
  if (p.nat !== nat.idx) return '自国の州ではない';

  if ((p.b[k] || 0) >= B.max) return 'これ以上は建てられない';
  if (B.coastal && !p.coastal) return '沿岸の州にしか建てられない';

EC.startBuild = (nat, p, k) => { const why = EC.canBuild(nat, p, k); if (why) return why; const cost = EC.buildCost(nat, p, k); nat.treasury -= cost; p.build = { k, lv: (p.b[k] || 0) + 1, left: Math.max(1, Math.round(D.BUILD[k].months * Math.max(0.4, 1 + EC.mod(nat, 'buildTime')))), cost }; return null; };
EC.buildStep = (nat) => {
  for (const p of S.provsOf(nat.idx)) {
    if (!p.build) continue;
    p.build.left--;
    if (p.build.left <= 0) { p.b[p.build.k] = p.build.lv; if (nat.player) S.news(`${p.n}に${D.BUILD[p.build.k].n}（${p.build.lv}）が完成した。`, 'good', nat.idx); p.build = null; }
  }

// 月の処理
EC.monthly = (nat) => {
  const fx = EC.lawFx(nat);

  // 輸出振興：装備の価値に応じた外貨
  const expK = fx.exportIncome + EC.mod(nat, 'exportIncome');
  const exp = expK > 0 ? Math.round(st.gdp * 0.015 * expK) : 0;
  nat.treasury += st.net + exp;
  st.income = st.net + exp;
  if (nat.treasury < 0) { nat.debt += -nat.treasury; nat.treasury = 0; }
  else if (nat.debt > 0) { const pay = Math.min(nat.debt, nat.treasury * 0.5); nat.debt -= pay; nat.treasury -= pay; }
  nat.treasury = Math.round(nat.treasury * 10) / 10; nat.debt = Math.round(nat.debt * 10) / 10;
  EC.techStep(nat);
  EC.buildStep(nat);
  // 州の成長
  const growth = 0.22 + nat.budget.dev * 3 + fx.growth * 12 + EC.mod(nat, 'growth') * 25 + EC.mod(nat, 'industry') * 0.08 + (nat.growth - 1) * 0.5;
  for (const p of S.provsOf(nat.idx)) {
    p.ind = U.clamp(p.ind + growth * (1 - p.ind / 115) * (p.dmg ? 0.5 : 1), 5, 100);
    p.pop = Math.round(p.pop * (1 + 0.0004 * nat.growth) * 100) / 100;
    if (p.dmg > 0) p.dmg = Math.max(0, p.dmg - 0.08);
    p.ind = Math.round(p.ind * 100) / 100;
  }
  // 安定
  const atWar = DP.atWar(nat.idx);
  let target = 56 + fx.stab + nat.budget.welfare * 90 - Math.max(0, nat.tax - 0.22) * 130 - nat.weariness * 0.4 - (nat.debt > st.rev * 8 ? 12 : nat.debt > st.rev * 3 ? 5 : 0) - (atWar ? 3 : 0) + U.clamp(nat.stat.wins - nat.stat.lost, -8, 8);
  target += EC.mod(nat, 'stab');
  nat.stab = U.clamp(nat.stab + (target - nat.stab) * 0.12, 0, 100);
  nat.stab = Math.round(nat.stab * 10) / 10;
  // 厭戦
  const wMul = Math.max(0.2, 1 + EC.mod(nat, 'weariness'));
  if (atWar) nat.weariness = Math.min(100, nat.weariness + 0.9 * fx.weariness * wMul);
  else nat.weariness = Math.max(0, nat.weariness - 2.5 / Math.max(0.6, wMul));
  // 評判は国柄の水準へ戻る
  const repT = (fx.rep + EC.mod(nat, 'rep')) * 8;
  nat.rep = Math.round((nat.rep * 0.97 + repT * 0.03) * 10) / 10;
  EC.recalc(nat);
};
EC.fmt = (v) => (v >= 0 ? '' : '-') + U.num(Math.abs(Math.round(v))) + '億';

/* =========================================================
   鋼鉄の大陸 — 外交（関係・条約・戦争・講和・AI外交）

const DP = {};

  S._border = set; return set;
};
DP.borders = (a, b) => a !== b && DP.borderSet().has(S.relKey(a, b));

DP.affinity = (A, B) => {

// 好戦性（性格＋特性＋設定）
DP.aggr = (N) => Math.max(0, (D.PERS[N.pers] || D.PERS.balanced).aggr + (TECHS.flag(N, 'aggr') || 0));

DP.casusBelli = (a, b) => {

  for (const w of DP.warsOf(a)) { const side = DP.sideOf(w, a); const foes = side === 'a' ? w.b : w.a; for (const f of foes) if (DP.allied(f, b) && !foes.includes(b)) out.push('敵の同盟国'); }

DP.giveCB = (a, b, months) => { G.flags.cb = G.flags.cb || {}; G.flags.cb[S.relKey(a, b) + ':' + a] = G.turn + (months || 24); };
DP.canDeclare = (a, b) => {

  if (DP.allied(a, b)) return '同盟国には宣戦できない';
  if (DP.hasNap(a, b)) return `不可侵条約がある（${S.date(DP.treaty(a, b).nap)}まで）`;
  if (EC.lawFx(G.nations[a]).noWar) return '中立政策のため宣戦できない';
  if (DP.patron(a) === b) return '宗主国には宣戦できない';
  if (!DP.reachable(a, b)) return '国境も海路もない';

// 講和：status quo（占領地はそのまま）/ cede（指定の州を渡す）
DP.makePeace = (w, terms) => {

DP.aiAcceptsPeace = (w, from, to, terms) => {

DP.ACTIONS = {

  nap: { n: '不可侵条約', d: '互いに三年間は宣戦しない。', cost: 0, cd: 6 },
  trade: { n: '通商条約', d: '互いの税収が増える。', cost: 0, cd: 6 },
  alliance: { n: '同盟', d: '攻められれば共に戦う。', cost: 0, cd: 12 },
  insult: { n: '非難', d: '相手を公然と非難する。関係は悪化するが、国内の支持が上がる。', cost: 0, cd: 3 },

DP.cdKey = (a, b, k) => `${a}|${b}|${k}`;

// 初期の軍
MIL.COMP = {
  land: { inf: 2, mech: 2, tank: 3, spg: 1.2, mlrs: 0.8, sam: 1, aaa: 0.6, recon: 0.6, sup: 0.5, ahel: 0.8 },
  air: { ftr: 1.2, mr: 1.6, atk: 0.6, bmb: 0.4, awacs: 0.25 },
  sea: { dd: 1.2, ff: 1.2, cg: 0.3, cv: 0.25, ss: 0.9, lha: 0.3, pb: 0.5 },
};
MIL.domShare = (nat) => {
  const ps = S.provsOf(nat.idx);
  const coast = ps.filter(p => p.coastal).length / Math.max(1, ps.length);
  const ports = ps.some(p => p.b.port);
  let sea = 0.08 + coast * 0.2 + ((nat.dom && nat.dom.sea) || 0);
  if (nat.pers === 'naval') sea += 0.06;
  let air = 0.24 + ((nat.dom && nat.dom.air) || 0) + (nat.wealth >= 1.2 ? 0.03 : 0);
  sea = ports ? U.clamp(sea, 0.04, 0.42) : 0; air = U.clamp(air, 0.12, 0.4);
  return { land: 1 - sea - air, air, sea };
};
// 兵科の比率（国ごとの得意を掛ける）
MIL.compFor = (nat, dom) => { const base = MIL.COMP[dom]; const out = {}; for (const c in base) out[c] = base[c] * ((nat.comp && nat.comp[c]) || 1); return out; };
// 税収から見た軍の規模（維持費が税収の半分ほどになる数）
// 人口の多い軍事国家は、税収が少なくても大きな軍を持つ（旧式装備で数をそろえる）
MIL.sizeFor = (nat, k) => {
  const rev = EC.revenue(nat); const m = (nat.mil || 1) * (1 + EC.mod(nat, 'milSize'));
  const pop = U.sum(S.provsOf(nat.idx), p => p.pop);
  const byRev = rev * (k || 0.45) / 0.9 * m, byPop = Math.sqrt(pop) * 0.8 * m * (k || 0.45) / 0.45;
  return Math.round(U.clamp(Math.max(byRev, byPop * 0.6, Math.min(byPop, byRev * 2.5)), 4, 220));
};
MIL.initialArmy = (nat) => {
  const total = MIL.sizeFor(nat, 0.42);
  const share = MIL.domShare(nat);
  const avail = MIL.available(nat);
  const provs = S.provsOf(nat.idx);
  const airProvs = provs.filter(p => p.b.airbase), portProvs = provs.filter(p => p.b.port);
  const rng = U.rng(WG.SEED0 + nat.idx * 7);
  // 陸は首都と国境の州に多め、内陸の州にも少し
  const landW = provs.map(p => { let t = p.capital ? 3 : 0.4; for (const q of G.world.adj[p.id] || []) if (G.world.provs[q].nat !== nat.idx) { t += 1; break; } return t; });
  const lsum = U.sum(landW, x => x);
  const pickLand = () => { let r = rng() * lsum; for (let k = 0; k < provs.length; k++) { r -= landW[k]; if (r <= 0) return provs[k]; } return provs[0]; };
  const pickProv = (dom) => { if (dom === 'land') return provs.length ? pickLand() : null; const list = dom === 'air' ? airProvs : portProvs; if (!list.length) return null; return list[Math.floor(rng() * list.length)]; };
  for (const dom of ['land', 'air', 'sea']) {
    const n = Math.round(total * share[dom]);
    const comp = MIL.compFor(nat, dom);
    const classes = Object.keys(comp).filter(c => EQ.bestOf(avail, c));
    if (!classes.length) continue;
    const wsum = U.sum(classes, c => comp[c]);
    let made = 0;
    const counts = {}; for (const c of classes) counts[c] = 0;
    while (made < n) {
      // 比率に最も足りない兵科
      let best = classes[0], bd = -Infinity;
      for (const c of classes) { const d = comp[c] / wsum * n - counts[c]; if (d > bd) { bd = d; best = c; } }
      counts[best]++; made++;
      const e = EQ.bestOf(avail, best);
      const p = pickProv(dom); if (!p) break;
      // 旧式と新式を混ぜる
      const olds = avail.filter(x => x.cls === best && x !== e);
      const m = olds.length && rng() < 0.35 ? olds[Math.floor(rng() * olds.length)] : e;
      MIL.addUnit(nat, m.id, p.id, { exp: Math.round(rng() * 20) });
    }
  }
};
// 州にいる部隊の再配置（州を失ったとき）
MIL.evacuate = (prov, fromNat) => {
  const nat = G.nations[fromNat];
  const home = S.provsOf(fromNat).filter(p => p.id !== prov);
  if (!home.length) return;
  for (const u of nat.units.filter(x => x.prov === prov)) {
    const e = EQ.get(u.m);
    const cands = home.filter(p => e.dom === 'air' ? p.b.airbase : e.dom === 'sea' ? p.b.port : true);
    const adj = (G.world.adj[prov] || []).filter(q => home.some(p => p.id === q) && cands.some(p => p.id === q));
    const to = adj.length ? adj[0] : (cands.length ? U.minBy(cands, p => HX.dist(p.c, p.r, G.world.provs[prov].c, G.world.provs[prov].r)).id : null);
    if (to == null) { nat.units.splice(nat.units.indexOf(u), 1); continue; }
    u.prov = to; u.hp = Math.max(1, u.hp - 2); u.mv = null;
  }

};
// ---- AI の軍備 ----
MIL.aiMonthly = (nat) => {
  const pers = D.PERS[nat.pers];
  const atWar = DP.atWar(nat.idx);
  // 予算・税
  nat.tax = atWar ? 0.34 : 0.27;
  nat.budget = { research: atWar ? 0.1 : 0.15, dev: atWar ? 0.06 : 0.12, welfare: nat.stab < 45 ? 0.2 : 0.1 };
  if (atWar && nat.laws.posture === 'peace' && !EC.canSetLaw(nat, 'posture', 'alert')) EC.setLaw(nat, 'posture', 'alert');
  if (atWar && nat.weariness < 40 && nat.stab > 55) { const w = DP.warsOf(nat.idx)[0]; const side = DP.sideOf(w, nat.idx); if (w.score[side === 'a' ? 'b' : 'a'] - w.score[side] > 20 && !EC.canSetLaw(nat, 'posture', 'mobilize')) EC.setLaw(nat, 'posture', 'mobilize'); }
  if (!atWar && nat.laws.posture !== 'peace' && !EC.canSetLaw(nat, 'posture', 'peace')) EC.setLaw(nat, 'posture', 'peace');
  if (nat.stab < 35 && nat.laws.tax === 'wartax') nat.laws.tax = 'flat';
  const share = MIL.domShare(nat);
  // 開発：資金に余裕があれば首都と前線の州に
  EC.recalc(nat);
  // 赤字なら予算を削り、それでも借金が膨らむなら古い部隊を手放す
  if (nat.stat.net < 0) {
    const b = nat.budget; b.research = Math.max(0.04, b.research - 0.05); b.dev = Math.max(0.02, b.dev - 0.06); b.welfare = Math.max(nat.stab < 40 ? 0.12 : 0.05, b.welfare - 0.04); nat.tax = Math.min(0.4, nat.tax + 0.04);
    EC.recalc(nat);
    if (nat.stat.net < 0 && nat.debt > nat.stat.rev * 3 && !atWar && nat.units.length > 4) {
      const u = U.minBy(nat.units, x => { const e = EQ.get(x.m); return e.pw / Math.max(0.05, e.upkeep) + e.y * 0.01; });
      if (u) MIL.disband(nat, u);
    }
  }
  const reserve = nat.stat.upkeep * 4 + nat.stat.rev * 1.5 + 15;
  for (let i = 0; i < 3 && nat.treasury > reserve + 20 + nat.stat.rev; i++) {
    const provs = S.provsOf(nat.idx).filter(p => !p.build);
    if (!provs.length || Math.random() > 0.6) break;
    const p = U.pick(provs);
    const order = atWar ? ['fort', 'sam', 'factory', 'airbase', 'infra', 'port'] : ['infra', 'factory', 'airbase', 'port', 'sam', 'fort'];
    for (const k of order) { if (!EC.canBuild(nat, p, k) && EC.buildCost(nat, p, k) < nat.treasury - reserve) { EC.startBuild(nat, p, k); break; } }
  }
  // 余った資金は研究と開発へ
  if (nat.treasury > reserve * 3 && !atWar) nat.budget.research = 0.22;
  // 調達：目標の規模へ
  const target = Math.round(MIL.sizeFor(nat, atWar ? 0.6 : 0.48) * pers.build * D.DIFF[G.diff].ai);
  const have = nat.units.length + nat.queue.length;
  if (have < target) {
    const avail = MIL.available(nat);
    let guard = 0;
    while (nat.units.length + nat.queue.length < target && guard++ < 6) {
      const counts = { land: 0, air: 0, sea: 0 };
      for (const u of nat.units) counts[EQ.get(u.m).dom]++;
      for (const q of nat.queue) counts[EQ.get(q.m).dom]++;
      const n = nat.units.length + nat.queue.length + 1;
      let dom = 'land', bd = -Infinity;
      for (const d of ['land', 'air', 'sea']) { const diff = share[d] * n - counts[d]; if (diff > bd) { bd = diff; dom = d; } }
      const comp = MIL.compFor(nat, dom);
      const cc = {}; for (const u of nat.units) { const c = EQ.get(u.m).cls; cc[c] = (cc[c] || 0) + 1; } for (const q of nat.queue) { const c = EQ.get(q.m).cls; cc[c] = (cc[c] || 0) + 1; }
      const classes = Object.keys(comp).filter(c => EQ.bestOf(avail, c));
      if (!classes.length) break;
      const wsum = U.sum(classes, c => comp[c]);
      const cls = U.maxBy(classes, c => comp[c] / wsum * counts[dom] - (cc[c] || 0) + Math.random() * 0.3);
      const e = MIL.aiChoose(nat, avail, cls);
      const provs = S.provsOf(nat.idx).filter(p => dom === 'air' ? p.b.airbase : dom === 'sea' ? p.b.port : true);
      if (!provs.length) break;
      const p = dom === 'land' ? (U.pick(provs.filter(x => x.b.factory)) || U.pick(provs)) : U.pick(provs);

// AI の装備選び：最良のものを基本に、国産を少し好む
MIL.aiChoose = (nat, avail, cls) => {
  const list = avail.filter(e => e.cls === cls); if (!list.length) return null;
  return U.maxBy(list, e => e.t * 10 + (e.y - 1980) * 0.1 + (EQ.isNative(nat, e) ? 4 : 0) - e.c * 0.02);
};
// AI の配置：敵（と緊張する隣国）に接する州へ寄せる。内陸の州から数を割り振る
MIL.aiDeploy = (nat) => {
  const foes = DP.enemies(nat.idx);
  const provs = S.provsOf(nat.idx); if (!provs.length) return;
  const threat = (p) => { let t = 0; for (const q of G.world.adj[p.id] || []) { const o = G.world.provs[q].nat; if (o === nat.idx || DP.allied(nat.idx, o)) continue; if (foes.includes(o)) t = Math.max(t, 4); else if (DP.rel(nat.idx, o) < -30) t = Math.max(t, 1.2); else t = Math.max(t, 0.3); } return t + (p.capital ? 0.8 : 0); };
  const front = provs.map(p => ({ p, t: threat(p) })).filter(x => x.t > 0.25);
  if (!front.length) return;
  const landUnits = nat.units.filter(u => EQ.get(u.m).dom === 'land' && u.mv == null);
  if (!landUnits.length) return;
  const tsum = U.sum(front, x => x.t);
  const want = new Map(); for (const x of front) want.set(x.p.id, landUnits.length * x.t / tsum);
  const here = new Map(); for (const u of landUnits) here.set(u.prov, (here.get(u.prov) || 0) + 1);
  const short = front.filter(x => (here.get(x.p.id) || 0) < want.get(x.p.id) - 0.5).sort((a, b) => (want.get(b.p.id) - (here.get(b.p.id) || 0)) - (want.get(a.p.id) - (here.get(a.p.id) || 0)));
  if (!short.length) return;
  const maxMoves = Math.max(4, Math.round(landUnits.length * (foes.length ? 0.35 : 0.15)));
  let moves = 0;
  // 余っている州（内陸・少ない脅威）の部隊から、足りない前線へ
  const spare = landUnits.filter(u => (here.get(u.prov) || 0) > (want.get(u.prov) || 0) + 0.5 && !(G.world.provs[u.prov].capital && (here.get(u.prov) || 0) <= 2));
  for (const u of spare) {
    if (moves >= maxMoves || !short.length) break;
    const tgt = short[0];
    if (MIL.move(nat, u, tgt.p.id)) continue;
    here.set(u.prov, here.get(u.prov) - 1); here.set(tgt.p.id, (here.get(tgt.p.id) || 0) + 1); moves++;
    if ((here.get(tgt.p.id) || 0) >= want.get(tgt.p.id) - 0.5) short.shift();
  }

};

/* =========================================================
   鋼鉄の大陸 — 戦略兵器（巡航ミサイル・弾道ミサイル・核）と抑止

const ST = {};
ST.KINDS = {
  cruise: { n: '巡航ミサイル', cost: 6, months: 1, unlock: 'unlock:cruise', d: '戦闘でミサイル支援に使う。' },
  bm: { n: '弾道ミサイル', cost: 18, months: 2, unlock: 'unlock:bm', d: '敵の州を直接叩く。施設や部隊に損害。' },
  nuke: { n: '核弾頭', cost: 80, months: 4, unlock: 'unlock:nuke', d: '運搬手段が要る。使えば世界が敵に回る。' },
};
ST.init = (nat) => { if (!nat.strat) nat.strat = {}; const s = nat.strat; if (s.missiles == null) s.missiles = 0; if (s.bms == null) s.bms = 0; if (s.nukes == null) s.nukes = 0; if (!s.queue) s.queue = []; if (!s.used) s.used = { bm: 0, nuke: 0 }; return s; };
ST.can = (nat, k) => TECHS.has(nat, ST.KINDS[k].unlock) && !(k === 'nuke' && ST.nukeMode() === 'none');
// 設定：'normal'（あり）／'nouse'（保有のみ・使用禁止）／'none'（核なし）
ST.nukeMode = () => (G && G.cfg && G.cfg.nukes) || 'normal';
ST.canUseNuke = (nat) => ST.can(nat, 'nuke') && TECHS.mod(nat, 'nukeDelivery') > 0;
ST.hasNukes = (nat) => nat.alive && ST.init(nat).nukes > 0 && ST.canUseNuke(nat) && ST.nukeMode() === 'normal';
ST.cap = (nat) => 1 + Math.floor(TECHS.mod(nat, 'missileProd'));
ST.cost = (nat, k) => Math.round(ST.KINDS[k].cost * Math.max(0.5, 1 + EC.mod(nat, 'cost:all')) * (k === 'nuke' ? Math.max(0.5, 1 - TECHS.mod(nat, 'nukeYield') * 0.05) : 1));
ST.months = (nat, k) => Math.max(1, Math.round(ST.KINDS[k].months / (1 + TECHS.mod(nat, 'missileProd') * 0.3)));
ST.stock = (nat, k) => { const s = ST.init(nat); return k === 'cruise' ? s.missiles : k === 'bm' ? s.bms : s.nukes; };
ST.canOrder = (nat, k) => {
  const s = ST.init(nat);

  if (s.queue.length >= ST.cap(nat)) return `生産枠が一杯（${ST.cap(nat)}）`;
  const c = ST.cost(nat, k); if (nat.treasury < c) return `資金が足りない（${c}億）`;

};
ST.order = (nat, k) => { const why = ST.canOrder(nat, k); if (why) return why; const c = ST.cost(nat, k); nat.treasury -= c; ST.init(nat).queue.push({ k, left: ST.months(nat, k), cost: c }); return null; };
ST.cancel = (nat, i) => { const s = ST.init(nat); const q = s.queue[i]; if (!q) return; nat.treasury += Math.round(q.cost * 0.5); s.queue.splice(i, 1); };
ST.monthly = (nat) => {
  const s = ST.init(nat);
  for (const q of s.queue.slice()) {
    q.left--;
    if (q.left <= 0) {
      s.queue.splice(s.queue.indexOf(q), 1);
      if (q.k === 'cruise') s.missiles++; else if (q.k === 'bm') s.bms++; else s.nukes++;
      if (nat.player) S.news(`${ST.KINDS[q.k].n}が配備された（備蓄 ${ST.stock(nat, q.k)}）。`, 'good', nat.idx);
    }
  }
  // 核保有が知れ渡る
  if (s.nukes > 0 && ST.canUseNuke(nat) && !s.known) { s.known = true; S.news(`${nat.n}が核戦力を配備した。`, 'war'); for (const x of G.nations) if (x.idx !== nat.idx && x.alive && !DP.allied(nat.idx, x.idx)) DP.addRel(nat.idx, x.idx, -6); }
};
/* ---------- 射程 ---------- */
ST.range = (nat) => Math.round((18 + TECHS.mod(nat, 'bmRange') * 10) * WG.K);
ST.inRange = (nat, pid) => { const tp = G.world.provs[pid]; const r = ST.range(nat); for (const p of S.provsOf(nat.idx)) if (HX.dist(p.c, p.r, tp.c, tp.r) <= r) return true; return TECHS.mod(nat, 'bmSub') > 0 && nat.units.some(u => EQ.get(u.m).cls === 'ss'); };
ST.canStrike = (nat, pid, k) => {

  if (ST.stock(nat, k) <= 0) return `${ST.KINDS[k].n}の備蓄がない`;
  if (k === 'nuke' && ST.nukeMode() !== 'normal') return '核の使用は禁止されている（開始時の設定）';

/* ---------- 弾道ミサイル攻撃 ---------- */
ST.strikeBM = (nat, pid) => {

/* ---------- 核攻撃 ---------- */
ST.strikeNuke = (nat, pid) => {

  const tp = G.world.provs[pid]; const T = G.nations[tp.nat]; const s = ST.init(nat);
  s.nukes--; s.used.nuke++; G.flags.nukesUsed = (G.flags.nukesUsed || 0) + 1;
  const pInt = U.clamp(TECHS.mod(T, 'abm') * 0.15 - TECHS.mod(nat, 'bmPen') * 0.08, 0, 0.6);
  const intercepted = Math.random() < pInt;
  const out = { intercepted, target: pid, popLost: 0, unitsLost: 0, retaliation: null };
  if (!intercepted) {
    const y = 1 + TECHS.mod(nat, 'nukeYield') * 0.12;
    out.popLost = Math.round(tp.pop * Math.min(0.7, 0.35 * y) * 10) / 10;
    tp.pop = Math.round((tp.pop - out.popLost) * 10) / 10; tp.ind = Math.max(5, tp.ind * 0.45); tp.dmg = 1; tp.build = null;
    for (const k of D.BUILD_ORDER) if (tp.b[k]) tp.b[k] = Math.max(0, tp.b[k] - 2);

  S.news(`${spec.title}（${D.SCALE[scale].n}）：${who ? who + 'の勝利' : '決着つかず'}。${A.s}の損失${lossVal.a ? Math.round(lossVal.a) + '億' : 'なし'}、${B.s}の損失${lossVal.b ? Math.round(lossVal.b) + '億' : 'なし'}。`, res.winner === -1 ? 'info' : (res.winner === 0 ? A : B).player ? 'good' : (res.winner === 0 ? B : A).player ? 'bad' : 'war');
  // 戦争の疲れ：敗北と損失

// 攻撃の開始（プレイヤー・AI 共通）
WAR.launch = async (atk, target, scale, from, opts = {}) => {
  const w = DP.warBetween(atk, G.world.provs[target].nat); if (!w) return null;
  const spec = WAR.makeSpec(atk, G.world.provs[target].nat, target, from, scale, Object.assign({ war: w }, opts));
  if (!spec.sides[0].units.length) return { empty: true };
  const involvesPlayer = spec.sides.some(s => s.player);
  let res;
  if (involvesPlayer && !G.autoBattle && !opts.auto) res = await HOOK.battle(spec);
  else res = WAR.autoResolve(spec);
  const out = WAR.applyResult(spec, res);
  return Object.assign({ spec, res }, out);
};
// AI が規模を選ぶ
WAR.aiScale = (atkN, defN, target, from) => {
  const pa = MIL.powerOf(WAR.pickForces(atkN, WAR.theater(atkN.idx, from, WAR.THEATER.total), 'total', target, false));
  const pb = MIL.powerOf(WAR.pickForces(defN, WAR.theater(defN.idx, target, WAR.THEATER.total), 'total', target, true));
  const r = pa / Math.max(1, pb);
  const n = atkN.units.length;
  if (r > 1.6 && n >= 20) return 'total';
  if (r > 1.1 && n >= 10) return 'regional';
  return 'local';
};
WAR.aiAttack = async (N) => {
  const pers = D.PERS[N.pers];
  const tg = WAR.targets(N); if (!tg.length) return;
  // 守りの弱い州を狙う
  const idx = MIL.index(); const P = G.world.provs;
  const near = (pid, nat) => { let v = 0; for (const u of idx.get(pid) || []) if (u.nat === nat && u.mv == null) { const e = EQ.get(u.m); v += e.pw * u.hp / e.hp; } return v; };
  const scored = tg.map(t => { const tp = P[t.to]; const dPow = near(t.to, tp.nat) + 0.3 * U.sum(G.world.adj[t.to] || [], q => P[q].nat === tp.nat ? near(q, tp.nat) : 0); const aPow = U.sum(t.froms, f => near(f, N.idx)); return { t, v: aPow / Math.max(1, dPow) + (tp.capital ? 0.3 : 0) + (tp.owner0 === N.idx ? 0.4 : 0) + (tp.res.oil ? 0.1 : 0) }; }).sort((a, b) => b.v - a.v);
  const best = scored[0];
  const cfgAggr = (G.cfg && G.cfg.aggr != null) ? G.cfg.aggr : 1;
  const chance = (0.12 + DP.aggr(N) * 0.15 + Math.min(0.25, (best.v - 1) * 0.15)) * Math.sqrt(cfgAggr);
  if (Math.random() > chance * D.DIFF[G.diff].ai) return;
  const def = G.nations[G.world.provs[best.t.to].nat];
  const scale = WAR.aiScale(N, def, best.t.to, best.t.froms[0]);
  if (def.player) { G.pending.push({ k: 'battle', atk: N.idx, target: best.t.to, from: best.t.froms[0], scale }); return; }
  await WAR.launch(N.idx, best.t.to, scale, best.t.froms[0], { auto: true });
};
WAR.monthly = async () => {
  for (const w of G.wars.slice()) {
    if (!G.wars.includes(w)) continue;
    // 各国の攻撃判断（AI）。プレイヤーへの攻撃は月に一つまで
    const members = [...w.a, ...w.b].filter(n => G.nations[n].alive && !G.nations[n].player);
    for (const n of U.shuffle(members.slice())) {
      if (!G.wars.includes(w)) break;
      if (G.pending.some(x => x.k === 'battle')) { if (WAR.targets(G.nations[n]).some(t => G.world.provs[t.to].nat === G.player)) continue; }
      await WAR.aiAttack(G.nations[n]);
    }
    if (!G.wars.includes(w)) continue;
    w.score.a *= 0.98; w.score.b *= 0.98;
    // 長引く戦争：AI 同士なら講和
    const A = G.nations[w.lead.a], B = G.nations[w.lead.b];
    if (!A.player && !B.player && G.turn - w.start > 12) {
      const diff = w.score.a - w.score.b;
      if (Math.random() < 0.12 + Math.abs(diff) / 200 + (A.weariness + B.weariness) / 400) {
        const loser = diff > 15 ? 'b' : diff < -15 ? 'a' : null;
        const terms = loser ? { cede: WAR.provsLost(w, w.lead[loser]).filter(p => p.nat !== w.lead[loser]).slice(0, 0).map(p => ({ p: p.id, to: p.nat })) } : null;
        DP.makePeace(w, terms);
      }
    }
  }
};

/* =========================================================
   鋼鉄の大陸 — 戦略地図（州マップ：真上から見たラスタ地図）
   格子を歪めてラスタ化するので、州境や海岸線は有機的な曲線になる。
   層：base（地形・陰影・海） → pol（国の色・州境・地方境・国境・戦線・戦災） → 重ね描き（名前・部隊・旗）

MAPV.s2m = (sx, sy) => [(sx - MAPV.vw / 2) / MAPV.cam.z + MAPV.cam.x, (sy - MAPV.vh / 2) / MAPV.cam.z + MAPV.cam.y];
MAPV.m2s = (mx, my) => [(mx - MAPV.cam.x) * MAPV.cam.z + MAPV.vw / 2, (my - MAPV.cam.y) * MAPV.cam.z + MAPV.vh / 2];
MAPV.provPx = (p) => [p.cx * MAPV.S, p.cy * MAPV.S];

MAPV.zMax = 6;

  c.y = U.clamp(c.y, Math.min(hh, MAPV.H / 2), Math.max(MAPV.H - hh, MAPV.H / 2));

MAPV.fit = () => { MAPV.cam.z = Math.min(MAPV.vw / MAPV.W, MAPV.vh / MAPV.H) * 0.98; MAPV.cam.x = MAPV.W / 2; MAPV.cam.y = MAPV.H / 2; MAPV.clamp(); };
MAPV.home = () => { const me = S.me(); const p = G.world.provs[me.capital]; if (!p) return; const [x, y] = MAPV.pc[p.id]; MAPV.cam.x = x; MAPV.cam.y = y; MAPV.cam.z = Math.max(MAPV.cam.z, 0.7); MAPV.clamp(); };

MAPV.focusProv = (p) => { const [x, y] = MAPV.pc[p]; MAPV.cam.x = x; MAPV.cam.y = y; if (MAPV.cam.z < MAPV.Z_NEAR) MAPV.cam.z = MAPV.Z_NEAR * 1.1; MAPV.clamp(); MAPV.redraw(); };

    const comp = MIL.compFor(n, dom); const classes = Object.keys(comp).filter(c => EQ.bestOf(avail, c)); if (!classes.length) continue;

    const p = dom === 'land' ? (Math.random() < 0.3 ? G.world.provs[n.capital] : U.pick(list)) : U.pick(list);

  while (left.length && guard++ < 50) {
    const next = [];
    for (const pid of left) {
      const cnt = new Map(); for (const q of G.world.adj[pid] || []) { const o = P[q].nat; if (o !== idx && G.nations[o].alive) cnt.set(o, (cnt.get(o) || 0) + 1); }
      if (cnt.size) { const to = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0][0]; ED.setOwner(pid, to); } else next.push(pid);
    }
    if (next.length === left.length) { for (const pid of next) { const p = P[pid]; const to = U.minBy(G.nations.filter(x => x.alive && x.idx !== idx), x => { const c = P[x.capital]; return (c.cx - p.cx) ** 2 + (c.cy - p.cy) ** 2; }); if (to) ED.setOwner(pid, to.idx); } break; }
    left = next;
  }
  const n = G.nations[idx]; if (n.alive) WAR.collapse(idx, null);
  ED.mark(); MAPV.invalidate(); UIM.refresh();
};
/* ---------- 操作する国の切り替え ---------- */
ED.playAs = (idx) => {
  const n = G.nations[idx]; if (!n || !n.alive || idx === G.player) return;
  const old = G.nations[G.player]; old.player = false; if (old.res) old.res.auto = true;
  G.player = idx; n.player = true;
  ED.mark(); MAPV.invalidate(); MAPV.home(); UIM.refresh();
  UI.toast(`${n.n}を操作する`);
  ED.natSheet(idx);
};
ED.playAsDialog = async () => { const v = await ED.chooseNation('操作する国を選ぶ', G.player, false); if (v != null) ED.playAs(v); };
/* ---------- 外交の編集 ---------- */
ED.dipSheet = (a, b) => {
  const A = G.nations[a];
  UIM.sheet(`編集：外交`, (body) => {
    const pickA = U.h('button', { class: 'item' }, UI.flagEl(A, 26), U.h('div', { style: { flex: 1 } }, U.h('b', {}, A.n), U.h('small', { class: 'muted', style: { display: 'block' } }, '▾ 国を替える')));
    pickA.onclick = async () => { const v = await ED.chooseNation('どの国の外交', a, false); if (v != null) ED.dipSheet(v, b === v ? null : b); };
    body.append(pickA);
    const g = U.h('div', { class: 'row wrap', style: { margin: '8px 0' } });
    const endAll = U.h('button', { class: 'btn xs' }, `${A.s}の戦争をすべて終える`); endAll.onclick = () => { for (const w of DP.warsOf(a).slice()) DP.makePeace(w); ED.mark(); MAPV.invalidate(); ED.dipSheet(a, b); };
    const peaceW = U.h('button', { class: 'btn xs' }, '世界の戦争をすべて終える'); peaceW.onclick = () => { for (const w of G.wars.slice()) DP.makePeace(w); ED.mark(); MAPV.invalidate(); ED.dipSheet(a, b); };
    g.append(endAll, peaceW); body.append(g);
    if (b == null) {
      body.append(U.h('div', { class: 'small muted', style: { marginBottom: '6px' } }, '相手を選ぶ'));
      const list = U.h('div', { class: 'list' });
      for (const n of G.nations.filter(x => x.alive && x.idx !== a).sort((x, y) => DP.rel(a, y.idx) - DP.rel(a, x.idx))) {
        const t = DP.treaty(a, n.idx); const tags = [DP.warBetween(a, n.idx) ? '⚔' : '', t.alliance ? '同盟' : '', t.trade ? '通商' : '', t.nap && t.nap > G.turn ? '不可侵' : ''].filter(Boolean).join('・');
        const it = U.h('button', { class: 'rel' }, UI.flagEl(n, 22), U.h('div', { style: { flex: 1, minWidth: 0 } }, U.h('b', {}, n.s), U.h('div', { class: 'small muted' }, tags || '—')), U.h('div', { class: 'v' }, String(Math.round(DP.rel(a, n.idx)))));
        it.onclick = () => ED.dipSheet(a, n.idx); list.append(it);
      }
      body.append(list); return;
    }
    const B = G.nations[b]; const t = DP.treaty(a, b); const w = DP.warBetween(a, b);
    const c = U.h('div', { class: 'card' });
    c.append(U.h('div', { class: 'edh' }, UI.flagEl(A, 24), U.h('b', {}, A.s), U.h('span', { class: 'muted' }, 'と'), UI.flagEl(B, 24), U.h('b', {}, B.s)));
    c.append(ED.fld('関係', ...ED.range(Math.round(DP.rel(a, b)), -100, 100, 1, v => String(v), (v) => { G.rel[S.relKey(a, b)] = v; })));
    c.append(ED.fld('条約', ED.check('同盟', t.alliance, (v) => { if (v && w) DP.makePeace(w); DP.setTreaty(a, b, { alliance: v }); ED.dipSheet(a, b); }), ED.check('通商', t.trade, (v) => DP.setTreaty(a, b, { trade: v })), ED.check('不可侵', t.nap && t.nap > G.turn, (v) => DP.setTreaty(a, b, { nap: v ? G.turn + 36 : 0 }))));
    const wr = U.h('div', { class: 'row wrap', style: { marginTop: '8px' } });
    if (w) { const pb = U.h('button', { class: 'btn sm' }, '講和させる'); pb.onclick = () => { DP.makePeace(w); ED.mark(); MAPV.invalidate(); ED.dipSheet(a, b); }; wr.append(pb, U.h('span', { class: 'small muted' }, `${S.date(w.start)}から交戦中・戦況 ${Math.round(w.score.a)} 対 ${Math.round(w.score.b)}`)); }
    else { const wb = U.h('button', { class: 'btn sm danger' }, '戦争を始めさせる'); wb.onclick = () => { ED.forceWar(a, b); MAPV.invalidate(); ED.dipSheet(a, b); }; wr.append(wb, U.h('span', { class: 'small muted' }, '同盟国は巻き込まない')); }
    c.append(wr);
    body.append(c);
    const back = U.h('button', { class: 'btn sm', style: { marginTop: '8px' } }, '‹ 相手を選び直す'); back.onclick = () => ED.dipSheet(a, null); body.append(back);
  });
};
ED.forceWar = (a, b) => {
  if (DP.warBetween(a, b)) return;
  DP.setTreaty(a, b, { alliance: false, nap: 0 });
  G.wars.push({ id: G.warSeq++, a: [a], b: [b], lead: { a, b }, start: G.turn, score: { a: 0, b: 0 }, battles: 0, last: -99, cb: true });
  DP.addRel(a, b, -40); ED.mark();
  S.news(`${G.nations[a].n}と${G.nations[b].n}が戦争状態に入った。`, 'war');
};
/* ---------- 設定の編集 ---------- */
ED.cfgSheet = () => {
  UIM.sheet('編集：設定', (body) => {
    const c = G.cfg;
    const card = U.h('div', { class: 'card' });
    card.append(U.h('h3', {}, '難易度'));

    body.append(card);
    for (const k of ['aggr', 'nukes', 'victory', 'endYear']) {
      const O = S.CFG_OPTS[k]; const cd = U.h('div', { class: 'card' });
      cd.append(U.h('h3', {}, O.n));
      cd.append(UI.seg(O.opts.map(([v, l]) => [v, l]), c[k], (v) => { c[k] = v; ED.mark(); if (k === 'nukes' && v === 'none') for (const n of G.nations) { ST.init(n).nukes = 0; n.strat.queue = n.strat.queue.filter(q => q.k !== 'nuke'); } ED.cfgSheet(); }));
      cd.append(U.h('div', { class: 'small muted', style: { marginTop: '4px' } }, O.d));
      body.append(cd);
    }
    const ot = U.h('div', { class: 'card' });
    ot.append(ED.check('戦闘を自動で解決する', G.autoBattle, (v) => { G.autoBattle = v; }));
    ot.append(U.h('div', { class: 'small muted', style: { marginTop: '6px' } }, `開始年 ${c.year}年・地図の種 ${c.seed}・参加 ${G.nations.length}か国（これらは新しい戦争でしか変えられない）`));
    body.append(ot);
  });
};

/* =========================================================
   鋼鉄の大陸 — 効果音（WebAudio で合成）
   ========================================================= */
const SND = { ctx: null, on: true, master: null };
try { SND.on = localStorage.getItem('steel.snd') !== '0'; } catch (e) {}
SND.ensure = () => {
  if (SND.ctx) return true;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.5; SND.master.connect(SND.ctx.destination); } catch (e) { return false; }
  return true;
};
SND.unlock = () => { if (!SND.ensure()) return; if (SND.ctx.state === 'suspended') SND.ctx.resume().catch(() => {}); };
SND.toggle = () => { SND.on = !SND.on; try { localStorage.setItem('steel.snd', SND.on ? '1' : '0'); } catch (e) {} return SND.on; };
SND.noise = (dur, vol, f0, f1, type) => {
  const c = SND.ctx; const n = Math.floor(c.sampleRate * dur); const buf = c.createBuffer(1, n, c.sampleRate); const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
  const src = c.createBufferSource(); src.buffer = buf;
  const flt = c.createBiquadFilter(); flt.type = type || 'lowpass'; flt.frequency.setValueAtTime(f0, c.currentTime); if (f1) flt.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  src.connect(flt); flt.connect(g); g.connect(SND.master); src.start();
};
SND.tone = (f0, f1, dur, vol, type) => {
  const c = SND.ctx; const o = c.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, c.currentTime); if (f1) o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g); g.connect(SND.master); o.start(); o.stop(c.currentTime + dur + 0.05);
};
SND.play = (k) => {
  if (!SND.on || !SND.ensure() || SND.ctx.state !== 'running') return;
  try {
    switch (k) {
      case 'gun': SND.noise(0.18, 0.5, 2500, 400); break;
      case 'artillery': SND.noise(0.5, 0.6, 500, 80); SND.tone(120, 40, 0.5, 0.3); break;
      case 'jet': SND.noise(0.6, 0.35, 3000, 800, 'bandpass'); break;
      case 'hit': SND.noise(0.25, 0.5, 1800, 200); break;
      case 'boom': SND.noise(0.9, 0.8, 900, 60); SND.tone(90, 30, 0.8, 0.5); break;
      case 'capture': SND.tone(660, 990, 0.18, 0.25, 'triangle'); setTimeout(() => SND.tone(990, 1320, 0.25, 0.25, 'triangle'), 120); break;
      case 'click': SND.tone(800, 600, 0.06, 0.12, 'square'); break;
      case 'turn': SND.tone(440, 330, 0.25, 0.2, 'triangle'); break;
      case 'alert': SND.tone(520, 520, 0.12, 0.25, 'square'); setTimeout(() => SND.tone(520, 520, 0.12, 0.25, 'square'), 180); break;
    }
  } catch (e) {}
};
SND.scene = () => {};
document.addEventListener('pointerdown', SND.unlock, { passive: true });

/* =========================================================
   鋼鉄の大陸 — 起動・PWA

// 戦闘で生産した部隊を軍へ
const _applyResult = WAR.applyResult;
WAR.applyResult = (spec, res) => {
  const out = _applyResult(spec, res);
  if (res.newUnits) for (let s = 0; s < 2; s++) { const nat = G.nations[spec.sides[s].nat]; const prov = s === 0 ? spec.from : spec.target; for (const nu of res.newUnits[s] || []) { if (G.world.provs[prov].nat !== nat.idx) continue; MIL.addUnit(nat, nu.m, prov, { exp: nu.exp }); } }
  return out;
};

MAIN.boot();
